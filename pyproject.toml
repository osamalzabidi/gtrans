[project]
name = "gtrans"
version = "1.0.0"
description = "A sophisticated desktop translation companion."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Osama Mohammed", email = "support.osamalzabidi@gmail.com" }
]
dependencies = [
    "flet>=1.0.0"
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.0",
    "flet-desktop>=1.0.0",
    #"flet-web>=1.0.0",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    #"flet[test]>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
desktop_flavor = "light"
org = "com.osamalzabidi"
product = "gtrans"
company = "osamalzabidi"
copyright = "Copyright (C) 2026 by osamalzabidi"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"
